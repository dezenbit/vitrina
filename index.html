<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vitrina</title>
<meta name="description" content="Vitrina: kit de lanzamiento para Google Play. Capturas con marco, gráfico destacado, ícono, ficha revisada, notas de versión y exportación lista para fastlane.">
<meta name="theme-color" content="#17694f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2317694f'/%3E%3Crect x='7' y='6' width='10' height='20' rx='2.5' fill='none' stroke='%23fff' stroke-width='2'/%3E%3Crect x='15' y='10' width='10' height='16' rx='2.5' fill='%23ffd166'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,800&family=Onest:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Sora:wght@600;800&family=Fraunces:opsz,wght@9..144,600;9..144,800&family=DM+Serif+Display&family=Archivo+Black&family=Nunito:wght@700;900&family=Unbounded:wght@600;800&family=Instrument+Serif&family=Rubik:wght@600;800&display=swap">
<link rel="stylesheet" href="css/vitrina.css">
</head>
<body>
<div class="shell">
  <header class="topbar">
    <a class="brand" href="#resumen" aria-label="Vitrina, ir al resumen">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32"><rect x="5" y="4" width="12" height="24" rx="3"/><rect class="fillmark" x="15" y="9" width="12" height="19" rx="3"/></svg></span>
      <span class="brand-name">Vitrina</span>
    </a>

    <div class="project-switch">
      <button class="project-btn" id="projectBtn" aria-haspopup="menu" aria-expanded="false">
        <canvas id="projectIcon" width="56" height="56" aria-hidden="true"></canvas>
        <span class="project-name" id="projectName">Proyecto</span>
        <svg viewBox="0 0 24 24" class="chev"><path d="m7 10 5 5 5-5"/></svg>
      </button>
      <div class="menu" id="projectMenu" role="menu" hidden></div>
    </div>

    <span class="save-state" id="saveState" role="status"></span>

    <div class="top-right">
      <label class="locale-pick" title="Idioma que estás editando">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"/></svg>
        <select id="localeSelect" aria-label="Idioma que estás editando"></select>
      </label>
      <button class="icon-btn" id="themeToggle" title="Cambiar tema claro/oscuro" aria-label="Cambiar tema claro u oscuro">
        <svg viewBox="0 0 24 24" class="sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.4 1.4M17.6 17.6 19 19M5 19l1.4-1.4M17.6 6.4 19 5"/></svg>
        <svg viewBox="0 0 24 24" class="moon"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4 6.8 6.8 0 0 0 20 14.5z"/></svg>
      </button>
      <a class="btn primary" href="#exportar" id="topExport"><svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg><span>Exportar</span></a>
    </div>
  </header>

  <nav class="sidenav" id="sidenav" aria-label="Secciones">
    <a href="#resumen" data-route="resumen"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="5" rx="2"/><rect x="13" y="10" width="8" height="11" rx="2"/><rect x="3" y="13" width="8" height="8" rx="2"/></svg><span>Resumen</span><i class="dot" data-dot="resumen"></i></a>
    <a href="#capturas" data-route="capturas"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="9" height="18" rx="2"/><rect x="14" y="6" width="6" height="12" rx="1.5"/></svg><span>Capturas</span><i class="dot" data-dot="capturas"></i></a>
    <a href="#destacado" data-route="destacado"><svg viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2"/><path d="m6 15 4-4 3 3 2-2 3 3"/></svg><span>Gráfico destacado</span><i class="dot" data-dot="destacado"></i></a>
    <a href="#icono" data-route="icono"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="5"/><circle cx="12" cy="12" r="3.5"/></svg><span>Ícono</span><i class="dot" data-dot="icono"></i></a>
    <a href="#ficha" data-route="ficha"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 12h7M9 16h5"/></svg><span>Ficha de tienda</span><i class="dot" data-dot="ficha"></i></a>
    <a href="#notas" data-route="notas"><svg viewBox="0 0 24 24"><path d="M12 3v3M12 18v3M4.2 7.5l2.6 1.5M17.2 15l2.6 1.5M4.2 16.5 6.8 15M17.2 9l2.6-1.5"/><circle cx="12" cy="12" r="3.5"/></svg><span>Notas de versión</span><i class="dot" data-dot="notas"></i></a>
    <a href="#checklist" data-route="checklist"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><path d="m3.5 6 1.5 1.5L7.5 5M3.5 12l1.5 1.5L7.5 11"/><circle cx="5" cy="18" r="1.4"/></svg><span>Lista de lanzamiento</span><i class="dot" data-dot="checklist"></i></a>
    <a href="#exportar" data-route="exportar"><svg viewBox="0 0 24 24"><path d="M4 14v6h16v-6"/><path d="M12 3v12M7.5 10.5 12 15l4.5-4.5"/></svg><span>Exportar</span></a>
  </nav>

  <main class="main" id="view" tabindex="-1"></main>
</div>

<div class="modal" id="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <header><h3 id="modalTitle"></h3><button class="icon-btn" data-close aria-label="Cerrar"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></header>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="js/util.js"></script>
<script src="js/samples.js"></script>
<script src="js/draw.js"></script>
<script src="js/text.js"></script>
<script src="js/ui.js"></script>
<script src="js/views-visual.js"></script>
<script src="js/views-text.js"></script>
<script src="js/views-launch.js"></script>
<script src="js/app.js"></script>
</body>
</html>
